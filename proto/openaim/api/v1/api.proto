// The openaimd local client API (design §3, §11).
//
// Every frontend (CLI, TUI, GUI) is a client of this one API, served by the
// daemon over gRPC on a Unix domain socket in its data directory. The socket
// is mode 0600 inside a 0700 directory: anyone who can connect controls the
// identity (ExportBackup hands out the seed under a passphrase the caller
// chooses), so the socket is the security boundary and there is no further
// authentication.
//
// This is a local API, not a wire format. It lives in its own proto package
// (openaim.api.v1) so it can change without touching the wire bodies in
// openaim.v1, and its names never collide with theirs.
//
// Draft: may change freely until the first tagged release.
//
// Conventions:
//   - Buddies are named by a selector string (BuddySelector below).
//   - Identity keys are lowercase unpadded base32 (the invite-link form).
//   - msg_id is the 8-byte synthetic message ID in lowercase hex.
//   - Errors use standard gRPC codes: INVALID_ARGUMENT for bad input,
//     NOT_FOUND for an unknown buddy, ALREADY_EXISTS for a duplicate buddy,
//     FAILED_PRECONDITION when the buddy's state forbids the call.

syntax = "proto3";

package openaim.api.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aghman/openaim/internal/apipb;apipb";

service Daemon {
  // Identity, version, uptime and counts (`openaim status`).
  rpc GetStatus(GetStatusRequest) returns (Status);

  // The whole buddy list, by group then name (`openaim buddies`).
  rpc ListBuddies(ListBuddiesRequest) returns (ListBuddiesResponse);

  // Adds a buddy by identity key, handle or invite link (see
  // AddBuddyRequest) and asks them to be our buddy (design §5.4): a
  // BUDDY_REQUEST is sealed once as a first contact, stored, and handed to
  // the transports (it stays queued while none is attached). The buddy
  // starts in BUDDY_STATE_PENDING_OUT. Adding a key that already asked us
  // (PENDING_IN) accepts their request instead.
  rpc AddBuddy(AddBuddyRequest) returns (Buddy);

  // Our invite link, openaim:add/<key>?h=<handle>&c=<contact hint>
  // (design §5.4), to share or show as a QR code.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

  // Accepts a PENDING_IN buddy's request: the buddy becomes ACCEPTED and
  // gets a BUDDY_ACCEPT with our presence key and reachability. Nothing
  // about our presence is shared before this. FAILED_PRECONDITION for a
  // PENDING_OUT (they haven't asked) or BLOCKED buddy. On an ACCEPTED buddy
  // it sends BUDDY_ACCEPT again.
  rpc AcceptBuddy(AcceptBuddyRequest) returns (Buddy);

  // Declines a PENDING_IN buddy's request: it is deleted and nothing is
  // sent. They can ask again; BlockBuddy stops that. FAILED_PRECONDITION if
  // the buddy isn't PENDING_IN.
  rpc DeclineBuddy(DeclineBuddyRequest) returns (DeclineBuddyResponse);

  // Blocks a buddy in any state (design §7.5): their frames and requests
  // are dropped unprocessed and nothing more is sent to them. Remove the
  // buddy to unblock.
  rpc BlockBuddy(BlockBuddyRequest) returns (Buddy);

  // Sets a buddy's petname and/or group (local labels).
  rpc SetBuddyLabels(SetBuddyLabelsRequest) returns (Buddy);

  // Removes a buddy with its queued messages and history.
  rpc RemoveBuddy(RemoveBuddyRequest) returns (RemoveBuddyResponse);

  // Records that the user checked (or un-checked) the buddy's safety number.
  rpc SetBuddyVerified(SetBuddyVerifiedRequest) returns (Buddy);

  // The safety number for us and a buddy (`openaim verify`, design §5.2).
  rpc GetSafetyNumber(GetSafetyNumberRequest) returns (SafetyNumber);

  // Re-checks a buddy's handle now (spec/handle.md §7) and reschedules the
  // next check. FAILED_PRECONDITION if the buddy has no handle. The pinned
  // key never changes, whatever the outcome.
  rpc CheckHandle(CheckHandleRequest) returns (CheckHandleResponse);

  // Seals an IM once and queues it for delivery (design §8.2). The returned
  // msg_id identifies it in History and events from then on.
  rpc SendIM(SendIMRequest) returns (SendIMResponse);

  // A buddy's recent IMs, both directions, oldest first.
  rpc History(HistoryRequest) returns (HistoryResponse);

  // Sets our presence and away message (`openaim away`). It persists across
  // daemon restarts.
  rpc SetPresence(SetPresenceRequest) returns (Presence);

  // A live stream of changes. The first event is always `ready`, sent once
  // the subscription is in place: a client that loads state after seeing it
  // misses nothing. A client that falls too far behind is cut off with
  // RESOURCE_EXHAUSTED and should resubscribe and reload. The stream ends with
  // UNAVAILABLE when the daemon shuts down.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event);

  // An encrypted backup file (spec/backup.md): identity seed and buddy list,
  // and the recovery seed when an earlier backup that holds it is passed in
  // (the daemon never keeps the recovery seed; see ExportBackupRequest).
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);

  // Stops the daemon gracefully. It replies first, then stops.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// BuddySelector (a string field named `buddy`) names one buddy. The daemon
// tries, in order:
//   1. an identity key (base32),
//   2. a key ID such as "~k3f9",
//   3. a petname, case-insensitively,
//   4. a handle, case-insensitively,
//   5. a short handle (spec/handle.md §8), case-insensitively.
// The first form that matches decides. If it matches more than one buddy the
// call fails with INVALID_ARGUMENT; use the identity key instead.

message GetStatusRequest {}

message Status {
  string identity_key = 1; // base32
  string key_id = 2;       // short UI label, e.g. "~k3f9"; not a security check
  string version = 3;      // daemon build version
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Duration uptime = 5;
  BuddyCounts buddies = 6;
  Presence presence = 7;
  uint32 queued_messages = 8; // sealed messages not yet acked, all buddies
  string data_dir = 9;
  // Our recovery public key (base32), which buddy requests and accepts
  // carry so buddies can pin it (spec/wire.md §4.6). Empty if this identity
  // has none: it was restored from its phrase, or made without a backup.
  string recovery_key = 10;
}

message BuddyCounts {
  uint32 total = 1;
  uint32 pending_out = 2;
  uint32 pending_in = 3;
  uint32 accepted = 4;
  uint32 blocked = 5;
}

enum BuddyState {
  BUDDY_STATE_UNSPECIFIED = 0;
  BUDDY_STATE_PENDING_OUT = 1; // we asked; waiting for them to accept
  BUDDY_STATE_PENDING_IN = 2;  // they asked; waiting for us
  BUDDY_STATE_ACCEPTED = 3;
  BUDDY_STATE_BLOCKED = 4;
}

message Buddy {
  string identity_key = 1; // base32; the buddy's identity
  string key_id = 2;
  string handle = 3;  // verified handle, or empty
  string petname = 4; // local name, or empty
  string group = 5;   // buddy-list group, e.g. "Buddies"
  BuddyState state = 6;
  bool verified = 7; // the user checked the safety number
  google.protobuf.Timestamp added_at = 8;
  // The buddy's presence as last heard. Always OFFLINE until transports
  // exist.
  Presence presence = 9;

  // What to call the buddy in a list: the petname, else the short handle,
  // else the key ID. Not a security label; show handle_status next to it.
  string display_name = 10;
  // The handle as the buddy list shows it: just the label for a handle one
  // level under the daemon's configured registry (spec/handle.md §8), else
  // the full handle. Empty when there is no handle. Info panels should show
  // the full `handle`.
  string short_handle = 11;
  // The handle's standing, from its last conclusive check. MOVED and
  // UNVERIFIED should be shown as "⚠ moved/unverified". UNSPECIFIED when
  // there is no handle or it was never checked conclusively.
  HandleStatus handle_status = 12;
  // The outcome of the most recent check, which may be UNREACHABLE (the
  // status above is then kept from before).
  HandleStatus handle_last_result = 13;
  google.protobuf.Timestamp handle_checked_at = 14;
  google.protobuf.Timestamp handle_next_check_at = 15;
  // While handle_status is MOVED: the base32 key the handle points to now.
  // For display only; the buddy stays identity_key.
  string handle_moved_to = 16;
  // Why the most recent check didn't verify. In AddBuddy's reply, when a
  // claimed handle was dropped, why it was dropped.
  string handle_error = 17;

  // The request they sent us: set while PENDING_IN, and kept afterwards.
  BuddyRequestInfo request = 18;
  // What they call themselves, from their latest request or accept. Their
  // own claim, unverified: never show it as if it were a petname or a
  // verified handle (design §5.3).
  string offered_name = 19;
  // Their recovery public key (base32), pinned from their request or
  // accept (spec/wire.md §4.6), or empty.
  string recovery_key = 20;
  // Our latest request to them, if we sent one.
  OutgoingRequest outgoing_request = 21;
}

// A buddy request we received. Repeat requests from the same key are
// merged into one.
message BuddyRequestInfo {
  string display_name = 1; // their claim, unverified
  string greeting = 2;     // from the latest request
  google.protobuf.Timestamp first_received_at = 3;
  google.protobuf.Timestamp last_received_at = 4;
  uint32 count = 5;                        // requests merged into this one
  google.protobuf.Timestamp sent_at = 6;   // the latest request's own timestamp
}

enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  REQUEST_STATE_QUEUED = 1;   // sealed and stored; no transport has taken it yet
  REQUEST_STATE_SENT = 2;     // a transport took it
  REQUEST_STATE_ANSWERED = 3; // they accepted
  REQUEST_STATE_FAILED = 4;   // abandoned (blocked, or too old to be accepted)
}

// A buddy request we sent (sealed once; retries resend the same frames).
message OutgoingRequest {
  RequestState state = 1;
  uint32 attempts = 2;
  string contact_hint = 3; // where it is addressed, or empty
  string last_error = 4;   // why the last attempt failed, or empty
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_attempt_at = 6;
}

enum HandleStatus {
  HANDLE_STATUS_UNSPECIFIED = 0;
  HANDLE_STATUS_VERIFIED = 1;    // the handle proves the pinned key
  HANDLE_STATUS_MOVED = 2;       // the handle proves a different key
  HANDLE_STATUS_UNVERIFIED = 3;  // the handle answered but proves nothing
  HANDLE_STATUS_UNREACHABLE = 4; // no trustworthy answer; retried later
}

message ListBuddiesRequest {}

message ListBuddiesResponse {
  repeated Buddy buddies = 1;
}

// Give identity_key, handle, or both:
//   - identity_key alone adds that key.
//   - handle alone (e.g. "alice.example.com" or "@Alice.Example.com")
//     verifies the handle over DoH and pins the key it proves. If it doesn't
//     verify the call fails: FAILED_PRECONDITION when the handle proves
//     nothing, UNAVAILABLE when the lookup couldn't be done.
//   - both adds the key, and keeps the handle only if it verifies and
//     points to that key. Otherwise the buddy is added without a handle and
//     the reply's handle_error says why.
// A handle that isn't valid syntax is INVALID_ARGUMENT either way.
//   - invite_link (openaim:add/<key>?h=&c=) adds the key it names, as
//     identity_key would, with its handle (if any) as the claimed handle and
//     its contact hint as where to send the request. identity_key and
//     handle, if also given, must match it. A malformed link (bad key,
//     punycode handle, a plain IP address as contact hint, ...) is
//     INVALID_ARGUMENT.
message AddBuddyRequest {
  string identity_key = 1; // base32, as in an invite link
  string petname = 2;      // optional
  string group = 3;        // optional; defaults to "Buddies"
  string handle = 4;       // optional; see above
  string invite_link = 5;  // optional; see above
  // Optional greeting sent with the request: ≤ 256 bytes, no control
  // characters but newline and tab.
  string greeting = 6;
}

message CreateInviteRequest {
  // Our handle to include, or empty. It's only a claim: whoever adds us
  // verifies it.
  string handle = 1;
  // A contact hint to use instead of the daemon's own (its current relay
  // reservation): a relay-circuit or mailbox multiaddr. A plain IP address
  // is INVALID_ARGUMENT, since the link would reveal it.
  string contact_hint = 2;
}

message CreateInviteResponse {
  string link = 1;
  string identity_key = 2;
  string handle = 3;
  string contact_hint = 4; // empty if none is known
  string note = 5;         // why something is missing, for the user
}

message AcceptBuddyRequest {
  string buddy = 1; // BuddySelector
}

message DeclineBuddyRequest {
  string buddy = 1; // BuddySelector
}

message DeclineBuddyResponse {}

message BlockBuddyRequest {
  string buddy = 1; // BuddySelector
}

message SetBuddyLabelsRequest {
  string buddy = 1; // BuddySelector
  // Absent leaves a label as it is. An empty petname clears it; an empty
  // group means "Buddies". ≤ 64 bytes, no control characters.
  optional string petname = 2;
  optional string group = 3;
}

message RemoveBuddyRequest {
  string buddy = 1; // BuddySelector
}

message RemoveBuddyResponse {}

message SetBuddyVerifiedRequest {
  string buddy = 1; // BuddySelector
  bool verified = 2;
}

message GetSafetyNumberRequest {
  string buddy = 1; // BuddySelector
}

message SafetyNumber {
  string safety_number = 1; // 8 groups of 5 digits, the same on both sides
  Buddy buddy = 2;
}

message CheckHandleRequest {
  string buddy = 1; // BuddySelector
}

message CheckHandleResponse {
  Buddy buddy = 1;         // after the check
  HandleStatus result = 2; // this check's outcome
}

message SendIMRequest {
  string buddy = 1; // BuddySelector
  // UTF-8, non-empty, no control characters except newline and tab. It must
  // fit the mesh layout, so the message can use any route.
  string text = 2;
}

message SendIMResponse {
  string msg_id = 1;
  Message message = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_INCOMING = 1;
  DIRECTION_OUTGOING = 2;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0; // incoming messages
  DELIVERY_STATE_QUEUED = 1;      // sealed, not yet fully acked
  DELIVERY_STATE_ACKED = 2;
  DELIVERY_STATE_FAILED = 3;
}

message Message {
  string msg_id = 1;
  string buddy_key = 2; // base32 identity key of the other side
  Direction direction = 3;
  string text = 4;
  // When the sender sealed it (the inner timestamp, whole seconds).
  google.protobuf.Timestamp sent_at = 5;
  // Incoming only: when this daemon delivered it.
  google.protobuf.Timestamp received_at = 6;
  // Outgoing only.
  DeliveryState delivery = 7;
  uint64 seq = 8; // per-direction counter
}

message HistoryRequest {
  string buddy = 1; // BuddySelector
  uint32 limit = 2; // most recent messages to return; 0 means 100, max 1000
}

message HistoryResponse {
  repeated Message messages = 1; // oldest first
}

enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_ONLINE = 1;
  PRESENCE_STATE_AWAY = 2;
  PRESENCE_STATE_OFFLINE = 3; // signed off
}

message Presence {
  PresenceState state = 1;
  // Shown to buddies while away. ≤ 1024 bytes, no control characters but
  // newline and tab. %n, %d and %t are substituted when sent (design §11.1).
  string away_message = 2;
  google.protobuf.Timestamp since = 3; // when the state last changed
}

message SetPresenceRequest {
  PresenceState state = 1; // UNSPECIFIED is rejected
  string away_message = 2;
}

message SubscribeEventsRequest {}

message Event {
  uint64 seq = 1; // increases by one per event within a daemon run
  google.protobuf.Timestamp time = 2;
  oneof kind {
    Ready ready = 10;
    Buddy buddy_added = 11;
    Buddy buddy_changed = 12;
    Buddy buddy_removed = 13; // the buddy as it was
    Message message_queued = 14;
    Message message_received = 15;
    Presence presence_changed = 16; // ours
    // A re-check found the buddy's handle moved to another key or no longer
    // proving anything. Sent when the status turns to a warning (or the
    // handle moves again), not on every check; buddy_changed follows every
    // check. The pinned key is unchanged.
    Buddy buddy_handle_warning = 17;
    // A buddy request arrived: a new PENDING_IN buddy (buddy_added comes
    // first) or a repeat merged into an earlier one. `request` holds it.
    Buddy buddy_request = 18;
  }
}

// Ready is the first event of every subscription.
message Ready {}

message ExportBackupRequest {
  bytes passphrase = 1; // encrypts the backup; must not be empty
  // Also return the 24-word recovery phrase, so the caller can show it
  // alongside the file (`openaim backup export`).
  bool include_recovery_phrase = 2;
  // An earlier backup file of this identity (OAIMBAK1). The recovery seed
  // lives only in backups, never in the daemon (spec/backup.md §5), so a new
  // backup holds it only if it is carried over from one that does. It must
  // be this identity's, with the recorded recovery key: otherwise
  // FAILED_PRECONDITION. A wrong passphrase is INVALID_ARGUMENT.
  bytes previous_backup = 3;
  // Opens previous_backup; empty means `passphrase`.
  bytes previous_passphrase = 4;
}

message ExportBackupResponse {
  bytes backup = 1; // an OAIMBAK1 file
  string recovery_phrase = 2;
  // Whether `backup` holds the recovery seed. When it doesn't but
  // recovery_key is set, keep the backup that does: without it the
  // identity can never sign a key rotation.
  bool includes_recovery_key = 3;
  string recovery_key = 4; // our recovery public key (base32), or empty
}

message ShutdownRequest {}

message ShutdownResponse {}
